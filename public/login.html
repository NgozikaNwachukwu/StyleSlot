
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | StyleSlot</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="logo">StyleSlot<span>.</span></a>
        <a href="browse.html" class="auth-back">Back to browsing</a>
    </header>

    <main class="auth-layout">

        <div class="auth-image">
            <div class="auth-image-content">
                <h2>Your next appointment awaits.</h2>
                <p>Find your favourite stylists and manage your bookings in one place.</p>
            </div>
        </div>

        <section class="auth-panel">
            <div class="auth-card">

                <span class="eyebrow">WELCOME BACK</span>
                <h1>Log in</h1>
                <p class="auth-description">
                    Enter your details to access your account.
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="password-toggle">
                                Show
                            </button>
                        </div>
                    </div>

                    <div id="formMessage" class="form-message" hidden></div>

                    <button type="submit" class="btn btn-primary auth-submit">
                        Log In
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Sign up</a>
                </p>

            </div>
        </section>

    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 StyleSlot. All rights reserved.</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
